<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Registrations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}"><i class="fas fa-calendar-alt me-2"></i>Event Registration System</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/events}">Events</a>
                <a class="nav-link active" th:href="@{/registrations}">My Registrations</a>
                <a class="nav-link" th:href="@{/profile}">Profile</a>
                <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-list-alt me-2"></i>My Registrations</h2>
            <a th:href="@{/events}" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i>Register for More Events
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Event Name</th>
                            <th>Location</th>
                            <th>Date & Time</th>
                            <th>Registration Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="registration : ${registrations}">
                            <td>
                                <strong th:text="${registration.event.name}"></strong>
                            </td>
                            <td>
                                <i class="fas fa-map-marker-alt text-danger me-1"></i>
                                <span th:text="${registration.event.location}"></span>
                            </td>
                            <td>
                                <i class="fas fa-clock text-info me-1"></i>
                                <span th:text="${#temporals.format(registration.event.date, 'MMM dd, yyyy HH:mm')}"></span>
                            </td>
                            <td th:text="${#temporals.format(registration.registrationDate, 'MMM dd, yyyy HH:mm')}"></td>
                            <td>
                                <span class="badge bg-success" th:text="${registration.status}"></span>
                            </td>
                            <td>
                                <a th:href="@{'/registrations/delete/' + ${registration.id}}" 
                                   class="btn btn-sm btn-danger" 
                                   onclick="return confirm('Are you sure you want to cancel this registration?')">
                                    <i class="fas fa-trash me-1"></i>Cancel
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(registrations)}">
                            <td colspan="6" class="text-center py-5">
                                <i class="fas fa-calendar-times fa-3x text-muted mb-3"></i>
                                <h5 class="text-muted">No Registrations Found</h5>
                                <p class="text-muted">You haven't registered for any events yet.</p>
                                <a th:href="@{/events}" class="btn btn-primary">
                                    <i class="fas fa-calendar me-2"></i>Browse Events
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
