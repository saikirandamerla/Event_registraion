<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin}"><i class="fas fa-cog me-2"></i>Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/admin}">Dashboard</a>
                <a class="nav-link active" th:href="@{/admin/events}">Events</a>
                <a class="nav-link" th:href="@{/admin/registrations}">Registrations</a>
                <a class="nav-link" th:href="@{/admin/users}">Users</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-calendar-alt me-2"></i>Manage Events</h2>
            <a th:href="@{/admin/events/new}" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i>Create New Event
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Event Name</th>
                            <th>Description</th>
                            <th>Location</th>
                            <th>Date & Time</th>
                            <th>Capacity</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="event : ${events}">
                            <td th:text="${event.id}"></td>
                            <td th:text="${event.name}"></td>
                            <td th:text="${event.description}"></td>
                            <td th:text="${event.location}"></td>
                            <td th:text="${#temporals.format(event.date, 'MMM dd, yyyy HH:mm')}"></td>
                            <td><span class="badge bg-success" th:text="${event.capacity}"></span></td>
                            <td>
                                <a th:href="@{'/admin/events/edit/' + ${event.id}}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i> Edit
                                </a>
                                <a th:href="@{'/admin/registrations/event/' + ${event.id}}" class="btn btn-sm btn-info">
                                    <i class="fas fa-users"></i> Registrations
                                </a>
                                <a th:href="@{'/admin/events/delete/' + ${event.id}}" class="btn btn-sm btn-danger" 
                                   onclick="return confirm('Are you sure you want to delete this event?')">
                                    <i class="fas fa-trash"></i> Delete
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(events)}">
                            <td colspan="7" class="text-center py-4">
                                <p class="text-muted">No events found.</p>
                                <a th:href="@{/admin/events/new}" class="btn btn-primary">Create First Event</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
