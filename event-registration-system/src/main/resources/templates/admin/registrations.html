<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Registrations - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin}"><i class="fas fa-cog me-2"></i>Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/admin}">Dashboard</a>
                <a class="nav-link" th:href="@{/admin/events}">Events</a>
                <a class="nav-link active" th:href="@{/admin/registrations}">Registrations</a>
                <a class="nav-link" th:href="@{/admin/users}">Users</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="mb-4"><i class="fas fa-users me-2"></i>All Registrations</h2>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Email</th>
                            <th>Event</th>
                            <th>Registration Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="registration : ${registrations}">
                            <td th:text="${registration.id}"></td>
                            <td th:text="${registration.user.fullName}"></td>
                            <td th:text="${registration.user.email}"></td>
                            <td th:text="${registration.event.name}"></td>
                            <td th:text="${#temporals.format(registration.registrationDate, 'MMM dd, yyyy HH:mm')}"></td>
                            <td><span class="badge bg-success" th:text="${registration.status}"></span></td>
                            <td>
                                <a th:href="@{'/admin/registrations/delete/' + ${registration.id}}" 
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Are you sure you want to delete this registration?')">
                                    <i class="fas fa-trash"></i> Delete
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(registrations)}">
                            <td colspan="7" class="text-center py-4">
                                <p class="text-muted">No registrations found.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
