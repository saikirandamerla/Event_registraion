<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.id != null ? 'Edit Event' : 'Create Event'}">Event Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin}"><i class="fas fa-cog me-2"></i>Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/admin}">Dashboard</a>
                <a class="nav-link" th:href="@{/admin/events}">Events</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-calendar-alt me-2"></i>
                            <span th:text="${event.id != null ? 'Edit Event' : 'Create New Event'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="${event.id != null ? '/admin/events/update/' + event.id : '/admin/events'}" 
                              th:object="${event}" method="post">
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Event Name:</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Description:</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="4" required></textarea>
                                <span class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                            </div>
                            
                            <div class="mb-3">
                                <label for="location" class="form-label">Location:</label>
                                <input type="text" class="form-control" id="location" th:field="*{location}" required>
                                <span class="text-danger" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></span>
                            </div>
                            
                            <div class="mb-3">
                                <label for="date" class="form-label">Date & Time:</label>
                                <input type="datetime-local" class="form-control" id="date" th:field="*{date}" required>
                                <span class="text-danger" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
                            </div>
                            
                            <div class="mb-3">
                                <label for="capacity" class="form-label">Capacity:</label>
                                <input type="number" class="form-control" id="capacity" th:field="*{capacity}" min="1" required>
                                <span class="text-danger" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></span>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>
                                    <span th:text="${event.id != null ? 'Update Event' : 'Create Event'}"></span>
                                </button>
                                <a th:href="@{/admin/events}" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
