<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registrations - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin}"><i class="fas fa-cog me-2"></i>Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/admin}">Dashboard</a>
                <a class="nav-link" th:href="@{/admin/events}">Events</a>
                <a class="nav-link" th:href="@{/admin/registrations}">Registrations</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="mb-4">
            <a th:href="@{/admin/events}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to Events
            </a>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Event Details</h4>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Event Name:</strong> <span th:text="${event.name}"></span></p>
                        <p><strong>Location:</strong> <span th:text="${event.location}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Date:</strong> <span th:text="${#temporals.format(event.date, 'MMM dd, yyyy HH:mm')}"></span></p>
                        <p><strong>Capacity:</strong> <span th:text="${event.capacity}"></span></p>
                    </div>
                </div>
                <p><strong>Description:</strong> <span th:text="${event.description}"></span></p>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-light">
                <h5 class="mb-0">
                    <i class="fas fa-users me-2"></i>Registrations 
                    <span class="badge bg-primary" th:text="${registrations.size()}"></span>
                </h5>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>User Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Registration Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="registration : ${registrations}">
                            <td th:text="${registration.id}"></td>
                            <td th:text="${registration.user.fullName}"></td>
                            <td th:text="${registration.user.email}"></td>
                            <td th:text="${registration.user.phone != null ? registration.user.phone : 'N/A'}"></td>
                            <td th:text="${#temporals.format(registration.registrationDate, 'MMM dd, yyyy HH:mm')}"></td>
                            <td><span class="badge bg-success" th:text="${registration.status}"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(registrations)}">
                            <td colspan="6" class="text-center py-4">
                                <p class="text-muted">No registrations for this event yet.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
