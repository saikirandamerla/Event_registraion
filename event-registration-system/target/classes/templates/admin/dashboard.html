<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Event Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .stats-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stats-card h3 {
            font-size: 48px;
            margin: 20px 0;
            color: #4CAF50;
        }
        .stats-card i {
            font-size: 48px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}"><i class="fas fa-cog me-2"></i>Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/events}">Events</a>
                <a class="nav-link" th:href="@{/profile}">Profile</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Admin Dashboard</h2>
        
        <div class="row mb-5">
            <div class="col-md-4">
                <div class="stats-card">
                    <i class="fas fa-calendar-alt"></i>
                    <h3 th:text="${totalEvents}">0</h3>
                    <p class="text-muted">Total Events</p>
                    <a th:href="@{/admin/events}" class="btn btn-primary btn-sm">Manage Events</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <i class="fas fa-users"></i>
                    <h3 th:text="${totalRegistrations}">0</h3>
                    <p class="text-muted">Total Registrations</p>
                    <a th:href="@{/admin/registrations}" class="btn btn-primary btn-sm">Manage Registrations</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <i class="fas fa-user"></i>
                    <h3 th:text="${totalUsers}">0</h3>
                    <p class="text-muted">Total Users</p>
                    <a th:href="@{/admin/users}" class="btn btn-primary btn-sm">Manage Users</a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <a th:href="@{/admin/events/new}" class="btn btn-success btn-lg w-100">
                                    <i class="fas fa-plus me-2"></i>Create New Event
                                </a>
                            </div>
                            <div class="col-md-4 mb-3">
                                <a th:href="@{/admin/events}" class="btn btn-info btn-lg w-100">
                                    <i class="fas fa-calendar me-2"></i>View All Events
                                </a>
                            </div>
                            <div class="col-md-4 mb-3">
                                <a th:href="@{/admin/registrations}" class="btn btn-warning btn-lg w-100">
                                    <i class="fas fa-list me-2"></i>View All Registrations
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
