<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Register for Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}"><i class="fas fa-calendar-alt me-2"></i>Event Registration System</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/events}">Events</a>
                <a class="nav-link" th:href="@{/registrations}">My Registrations</a>
                <a class="nav-link" th:href="@{/profile}">Profile</a>
                <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Register for Event</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <h5><i class="fas fa-calendar-alt me-2"></i><span th:text="${event.name}"></span></h5>
                            <p class="mb-1"><i class="fas fa-map-marker-alt me-2"></i><span th:text="${event.location}"></span></p>
                            <p class="mb-1"><i class="fas fa-clock me-2"></i><span th:text="${#temporals.format(event.date, 'MMM dd, yyyy HH:mm')}"></span></p>
                            <p class="mb-0"><strong>Description:</strong> <span th:text="${event.description}"></span></p>
                        </div>

                        <form th:action="@{/registrations}" th:object="${registration}" method="post">
                            <input type="hidden" th:field="*{event.id}">
                            
                            <div class="alert alert-success">
                                <i class="fas fa-info-circle me-2"></i>
                                You are registering as <strong sec:authentication="principal.username"></strong>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check me-2"></i>Confirm Registration
                                </button>
                                <a th:href="@{/events}" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
